<!-- Barra di selezione brand (solo dev/showcase) -->
<div class="brand-switcher">
  <span class="brand-switcher__label">Brand:</span>
  @for (brand of themeService.availableBrands; track brand.key) {
    <button
      class="brand-switcher__btn"
      [class.active]="themeService.currentBrand() === brand.key"
      (click)="themeService.setBrand(brand.key)"
    >
      {{ brand.label }}
    </button>
  }
</div>

<router-outlet />
